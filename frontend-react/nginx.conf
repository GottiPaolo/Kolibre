# Diverso da frontend/nginx.conf per due motivi, entrambi voluti:
#
# 1. Nessun reverse proxy verso il backend qui. Il browser chiama il backend
#    DIRETTAMENTE (vedi src/lib/api.ts: in produzione risolve l'URL da
#    window.location.hostname + la porta del backend) — funziona perché
#    CORS è già completamente aperto lato backend (allow_origins="*" +
#    allow_credentials=True, backend/app/main.py). Semplifica questo
#    container e non richiede toccare quello Vue esistente.
#
# 2. try_files ha un fallback SPA (/index.html) — a differenza del frontend
#    Vue attuale (che non ne ha bisogno, ogni pagina è un file .html reale),
#    react-router usa URL veri lato client: senza questo fallback,
#    ricaricare la pagina su /autori darebbe 404 (nginx cercherebbe un file
#    che non esiste).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Stesso limite del backend (POST /api/kolibre/ingest/upload) e dello
    # stesso valore già usato in frontend/nginx.conf — nessun motivo per
    # essere più restrittivi qui.
    client_max_body_size 300M;

    # ── Cosa si puo' tenere in cache, e cosa no ──
    #
    # Senza queste due regole, nginx serviva index.html con le sue impostazioni
    # di default e il browser se lo teneva: dopo un deploy si continuava a
    # vedere l'applicazione VECCHIA finche' non si faceva un ricaricamento
    # forzato. E' successo almeno tre volte, e ogni volta e' costata mezz'ora
    # a capire che il codice nuovo c'era ma nessuno lo stava eseguendo — una
    # volta arrivando a misurare la versione del server per escludere il
    # contrario.
    #
    # La distinzione e' quella standard per una SPA compilata da Vite:
    #
    # - i file sotto /assets/ hanno l'impronta del contenuto nel NOME
    #   (index-a1b2c3.js): se il contenuto cambia cambia il nome, quindi
    #   quelli si possono tenere per sempre. "immutable" dice al browser di
    #   non chiedere nemmeno se sono cambiati;
    # - index.html NON ha impronta, ed e' il file che dice quali assets
    #   caricare: quello non si tiene mai. Va richiesto ad ogni visita, o il
    #   deploy non arriva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Il manifesto dell'applicazione web. La tabella dei tipi di nginx non
    # conosce l'estensione .webmanifest e lo servirebbe come testo semplice:
    # alcuni browser lo scartano, e l'icona salvata sulla schermata iniziale
    # tornerebbe a essere una miniatura della pagina.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
